name: Debug Build (Mochy UI)

on:
  push:
    branches: [mochy-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-mochy-ui
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      LISTEN_TOGETHER_SERVER: https://party.rikinurjaman.my.id
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Firebase config for the admin push system (Tahap 1). The file is a
      # CI secret (base64), decoded here and never committed or printed.
      # The Firebase project registers com.riki.chordwave; the dev flavor
      # builds as com.riki.chordwave.dev, and the google-services plugin
      # refuses to build a variant whose package has no client entry — so
      # the dev packages get a copy of the prod client entry at build time
      # (see .github/scripts/google-services-dev-clients.py). Registering
      # the dev package in the Firebase console and updating the secret
      # makes that step a no-op.
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          python3 .github/scripts/google-services-dev-clients.py

      - name: Build dev debug APK
        run: ./gradlew assembleDevDebug

      - name: Publish APK to rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev-mochy-ui --prerelease \
            --target "${{ github.sha }}" \
            --title "Dev build (Mochy UI clone)" \
            --notes "Rolling debug build from the mochy-ui branch. The in-app updater's Dev channel follows this pre-release." \
            2>/dev/null || true
          gh release upload dev-mochy-ui app/build/outputs/apk/dev/debug/*.apk --clobber
